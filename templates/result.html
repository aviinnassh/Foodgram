 <!DOCTYPE html>
<html lang="en">

<head>
    <meta name="view-transition" content="same-origin">
        {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="tab" rel="icon" href="{% static 'images/Foodgram.png' %}" type="image/x-icon">
    <title>Foodgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>

<body>
        <!-- Top Navbar -->
    <nav class="top-navbar">
        <a href="/" class="nav-brand">
            <i class="fa-solid fa-hat-chef"></i> Foodgram
        </a>

        <div class="nav-links">
            <a href="/" class="nav-item-home"><i class="fas fa-home"></i> Home</a>
            <a href="/explore" class="nav-item-explore"><i class="fa-solid fa-magnifying-glass"></i> Explore</a>
            <a href="/addRecipe" class="nav-item-addRecipe"><i class="fas fa-plus"></i> Add Recipe</a>

            <div class="notification">
                <a href="/notifications" class="nav-item-notifications"><i class="fas fa-bell"></i> Notifications</a>
                {% if unread_count > 0 %}
                <span class="notification-badge">{{ unread_count }}</span>
                {% endif %}
            </div>

            <a href="/profile" class="nav-item-profile"><i class="fas fa-user"></i> Profile</a>
        </div>

        <div class="nav-right">
            <a href="/profile" class="user-profile-circle">
                {{ request.user.first_name|slice:":1"|default:"U" }}{{ request.user.last_name|slice:":1"|default:"S" }}
            </a>
        </div>
    </nav>
    <script>
        // Set active class dynamically
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path === '/' || path.includes('userHome')) {
                document.querySelector('.nav-item-home')?.classList.add('active');
            } else if (path.includes('explore')) {
                document.querySelector('.nav-item-explore')?.classList.add('active');
            } else if (path.includes('addRecipe')) {
                document.querySelector('.nav-item-addRecipe')?.classList.add('active');
            } else if (path.includes('notifications')) {
                document.querySelector('.nav-item-notifications')?.classList.add('active');
            } else if (path.includes('profile')) {
                document.querySelector('.nav-item-profile')?.classList.add('active');
            }
        });
    </script>
    {% csrf_token %}
    <div class="container-fluid main"> 
        <div class="row search">
            <input type="text" id="searchInput" placeholder="Search for dish, cuisine, or user...">
        <div class="searchRes">
            <div class="searchBtn">
                <button class="toggle-button" data-target="dishes">Dishes</button>
                <button class="toggle-button" data-target="users">Users</button>
            </div>
        
            <div class="row">
                <div class="col-6 dishes" id="dishes">
                    <h2>Dishes</h2>
                    <!-- Dishes will be injected here by JavaScript -->
                </div>
        
                <div class="col-6 users" id="users">
                    <h2>Users</h2>
                    <!-- Users will be injected here by JavaScript -->
                </div>
            </div>
        </div>
        
    </div>


<script src="{% static 'js/java.js' %}" defer></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll('a[href^="/save/"], a[href^="/unsave/"], a[href^="/report/"], a[href^="/follow/"], a[href^="/unfollow/"]').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                
                // Visual update immediately for snappiness
                if (href.startsWith('/save/')) {
                    this.setAttribute('href', href.replace('/save/', '/unsave/'));
                    this.innerHTML = '<i class="fa-solid fa-bookmark me-2"></i> Unsave';
                } else if (href.startsWith('/unsave/')) {
                    this.setAttribute('href', href.replace('/unsave/', '/save/'));
                    this.innerHTML = '<i class="fa-regular fa-bookmark me-2"></i> Save';
                } else if (href.startsWith('/follow/')) {
                    this.setAttribute('href', href.replace('/follow/', '/unfollow/'));
                    this.innerHTML = '<i class="fa-solid fa-user-minus"></i> Unfollow';
                } else if (href.startsWith('/unfollow/')) {
                    this.setAttribute('href', href.replace('/unfollow/', '/follow/'));
                    this.innerHTML = '<i class="fa-solid fa-user-plus"></i> Follow';
                } else if (href.startsWith('/report/')) {
                    this.innerHTML = '<i class="fa-solid fa-check me-2"></i> Reported';
                    this.style.pointerEvents = 'none';
                }

                // Send background request
                fetch(href, {
                    method: 'GET',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                }).catch(err => console.error("Error:", err));
            });
        });
    });
</script>

</body>

</html>
