
<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="view-transition" content="same-origin">
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=2.1">
    <style>
        /* Specific overrides for single-card layout */
        .single-card-container {
            width: 450px !important;
            min-height: 450px !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .single-card-form-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .icon-container {
            font-size: 50px;
            color: #ff5722;
            margin-bottom: 20px;
        }

        /* Remove spin buttons from number input */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>

<body>

    <div class="container single-card-container" id="container">
        <div class="single-card-form-wrapper">
            <form action="" method="post">
                {% csrf_token %}
                <div class="icon-container">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
                <h1>Verify <span>Email</span></h1>
                <p>We've sent an OTP to your email address. Please enter it below to verify your account.</p>

                <div class="input-group-custom">
                    <i class="fa-solid fa-key"></i>
                    <input type="number" name="uotp" placeholder="Enter OTP" required />
                </div>

                <button type="submit">Verify &nbsp; <i class="fa-solid fa-arrow-right"></i></button>
                <div class="already-account">
                    Didn't receive the code? <span class="link-text" onclick="window.location.reload();">Resend</span>
                </div>
            </form>
        </div>
    </div>

    {% if messages %}
    <div style="position: absolute; top: 20px; z-index: 9999; width: 100%; display: flex; justify-content: center;">
        <div>
            {% for message in messages %}
            <div class="alert alert-warning alert-dismissible fade show shadow-sm">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

</body>

</html>
